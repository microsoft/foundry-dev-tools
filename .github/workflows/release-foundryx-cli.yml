name: Build and release FoundryX CLI binary

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Trusted source branch from SmallBlackHole/foundry-orchestrator-agent"
        required: true
        default: main
        type: string
      environment:
        description: "Service profile embedded in the CLI"
        required: true
        default: staging
        type: string

permissions:
  contents: read

concurrency:
  group: release-foundryx-cli
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve source branch
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate invocation
        env:
          SOURCE_SSH_KEY: ${{ secrets.FOUNDRYX_SOURCE_SSH_KEY }}
        run: |
          git check-ref-format "refs/heads/$env:SOURCE_BRANCH"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($env:SOURCE_BRANCH)) {
            throw 'source_branch must be a valid Git branch name.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_SSH_KEY)) {
            throw 'Configure the FOUNDRYX_SOURCE_SSH_KEY Actions secret with a read-only source deploy key.'
          }

      - name: Checkout destination automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify release automation
        run: |
          node --test .\automation\.github\scripts\foundryx_release.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release automation tests failed.' }

      - name: Checkout private FoundryX source
        uses: actions/checkout@v4
        with:
          repository: SmallBlackHole/foundry-orchestrator-agent
          ref: refs/heads/${{ inputs.source_branch }}
          ssh-key: ${{ secrets.FOUNDRYX_SOURCE_SSH_KEY }}
          path: source
          persist-credentials: false

      - name: Record source commit
        id: source
        working-directory: source/FoundryX/cli
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve the checked-out source commit.'
          }
          "commit=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building source branch $env:SOURCE_BRANCH at $actual"
          if (-not (Test-Path -LiteralPath '.\scripts\build-binary.mjs')) {
            throw 'The selected source branch does not contain the binary build. Commit and push it first.'
          }

  build:
    name: Build and verify ${{ matrix.target }} binary
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: ubuntu-22.04, target: linux-x64 }
    env:
      SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
      FOUNDRYX_RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      EXPECTED_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout destination automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Select Git for Windows SSH
        if: runner.os == 'Windows'
        run: |
          $git = (Get-Command git -ErrorAction Stop).Source
          $sshDirectory = Join-Path (Split-Path (Split-Path $git -Parent) -Parent) 'usr\bin'
          $ssh = Join-Path $sshDirectory 'ssh.exe'
          if (-not (Test-Path -LiteralPath $ssh)) {
            throw "Git for Windows SSH was not found at $ssh."
          }
          # Use the SSH client paired with Git instead of the system client with different ACL handling.
          $sshDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Checkout resolved source commit
        uses: actions/checkout@v4
        with:
          repository: SmallBlackHole/foundry-orchestrator-agent
          ref: ${{ needs.resolve.outputs.source_commit }}
          ssh-key: ${{ secrets.FOUNDRYX_SOURCE_SSH_KEY }}
          path: source
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare Linux credential store
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11

      - name: Install dependencies and verify native target
        working-directory: source/FoundryX/cli
        run: |
          node -e "if (process.platform + '-' + process.arch !== process.env.EXPECTED_TARGET) throw new Error('Runner architecture does not match target')"
          if ($LASTEXITCODE -ne 0) { throw 'Runner architecture mismatch.' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'CLI dependency installation failed.' }

      - name: Build service profile and verify CLI
        working-directory: source/FoundryX/cli
        run: |
          npm run build -- --environment "$env:RELEASE_ENVIRONMENT"
          if ($LASTEXITCODE -ne 0) { throw 'CLI build or service profile generation failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'CLI tests failed.' }

      - name: Build and verify standalone executable
        working-directory: source/FoundryX/cli
        run: |
          npm run vendor:keytar
          if ($LASTEXITCODE -ne 0) { throw 'Native keytar vendoring failed.' }
          npm run build:binary
          if ($LASTEXITCODE -ne 0) { throw 'Binary build failed.' }

      - name: Verify standalone executable
        if: runner.os != 'Linux'
        working-directory: source/FoundryX/cli
        run: |
          npm run test:binary
          if ($LASTEXITCODE -ne 0) { throw 'Standalone executable tests failed.' }

      - name: Verify Linux executable with a session keyring
        if: runner.os == 'Linux'
        working-directory: source/FoundryX/cli
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bash -euo pipefail -c '
            export GNOME_KEYRING_CONTROL
            GNOME_KEYRING_CONTROL="$(mktemp -d)"
            trap "rm -rf \"$GNOME_KEYRING_CONTROL\"" EXIT
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets --control-directory="$GNOME_KEYRING_CONTROL"
            npm run test:binary
          '

      - name: Stage binary, checksum and provenance
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'automation' '.github' 'scripts' 'foundryx_release.mjs'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'source' 'FoundryX' 'cli'
          $output = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          node $script stage $cli $output
          if ($LASTEXITCODE -ne 0) { throw 'Release staging failed.' }

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: foundryx-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble all platform binaries
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Checkout destination automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: foundryx-*
          path: platform-artifacts

      - name: Assemble verified platform builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir platform-builds
          for target in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64; do
            mv "platform-artifacts/foundryx-$target" "platform-builds/$target"
          done
          node automation/.github/scripts/foundryx_release.mjs assemble platform-builds release-assets

      - name: Upload combined release
        uses: actions/upload-artifact@v4
        with:
          name: foundryx-all-platforms
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish destination prerelease
    needs: [resolve, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Checkout destination automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download combined release
        uses: actions/download-artifact@v4
        with:
          name: foundryx-all-platforms
          path: release-assets

      - name: Verify checksum and provenance
        id: release
        run: node automation/.github/scripts/foundryx_release.mjs verify release-assets

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          assets=(release-assets/*)
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-assets/release-notes.md \
            --prerelease --latest=false
