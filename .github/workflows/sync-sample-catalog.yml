name: Sync Sample Catalog

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full foundry-samples SHA to scan incrementally. Blank = latest main."
        required: false
        type: string
        default: ""
      validation_only:
        description: "Generate and validate artifact only; do not create a branch or PR."
        required: false
        type: boolean
        default: false

# Least-privilege for the default GITHUB_TOKEN: only what `actions/checkout`
# needs. All writes (push branch + create PR) are performed via the GitHub
# App token generated below, not GITHUB_TOKEN.
permissions:
  contents: read

# A single in-flight sync at a time — a re-trigger cancels any earlier run
# rather than racing it for the same PR branch.
concurrency:
  group: sync-sample-catalog-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      REPO_ROOT: ${{ github.workspace }}
      AI_REFINE: 'false'
      IGNORE_EXISTING: 'false'
      AZURE_OPENAI_REASONING_EFFORT: ${{ vars.AZURE_OPENAI_REASONING_EFFORT }}
      PR_LABEL_CANDIDATES: |
        automated-pr
        area:samples
        area:hosted-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare sync paths
        shell: bash
        run: |
          {
            printf 'CATALOG_SYNC_STATE=%s/catalog-sync/state.json\n' "$RUNNER_TEMP"
            printf 'CATALOG_REVIEW_REPORT_DIR=%s/catalog-review\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Resolve pinned source revision
        id: resolve-sha
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_SHA" ]]; then
            sha="$INPUT_SHA"
            source="user-supplied input"
          else
            sha=$(gh api repos/microsoft-foundry/foundry-samples/commits/main --jq .sha)
            source="latest microsoft-foundry/foundry-samples@main"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved SHA must be a full 40-character commit: $sha" >&2
            exit 1
          fi
          echo "Using SHA $sha (source: $source)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "- Pinned SHA: \`$sha\` ($source)" >> "$GITHUB_STEP_SUMMARY"

      - name: 1. Scan sample changes
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.resolve-sha.outputs.sha }}
        run: node .github/scripts/generate_sample_catalog.mjs --sync-stage scan "$SOURCE_SHA"

      - name: 2. Generate new template metadata
        if: ${{ steps.scan.outputs.has_changes == 'true' }}
        env: &generation-env
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.resolve-sha.outputs.sha }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: node .github/scripts/generate_sample_catalog.mjs --sync-stage metadata "$SOURCE_SHA"

      - name: 3. Group templates and review card reuse
        if: ${{ steps.scan.outputs.has_changes == 'true' }}
        env: *generation-env
        run: node .github/scripts/generate_sample_catalog.mjs --sync-stage group "$SOURCE_SHA"

      - name: 4. Update affected card Details
        if: ${{ steps.scan.outputs.has_changes == 'true' }}
        env: *generation-env
        run: node .github/scripts/generate_sample_catalog.mjs --sync-stage details "$SOURCE_SHA"

      - name: 5. Write structurally validated candidate
        if: ${{ steps.scan.outputs.has_changes == 'true' }}
        env:
          SOURCE_SHA: ${{ steps.resolve-sha.outputs.sha }}
        run: node .github/scripts/generate_sample_catalog.mjs --sync-stage write "$SOURCE_SHA"

      - name: Validate catalog snapshot
        run: |
          node --test .github/scripts/sample_catalog_cards.test.mjs
          node .github/scripts/review_catalog_pr.mjs --sandbox-smoke-test

      - name: Detect catalog changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          catalog_files=("samples/hosted-agent/sample-catalog.json")

          for file in "${catalog_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required catalog file missing: $file" >&2
              exit 1
            fi
          done

          # Stage the file so git diff detects both new and modified files
          git add -- "${catalog_files[@]}"

          if git diff --cached --quiet -- "${catalog_files[@]}"; then
            echo "No changes to sample catalog."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Catalog has changes:"
          git diff --cached --stat -- "${catalog_files[@]}"

          {
            echo "## Sample Catalog Sync"
            echo
            echo "The sample catalog was regenerated from \`microsoft-foundry/foundry-samples\`."
            echo
            echo "### Changed files"
            for file in "${catalog_files[@]}"; do
              echo "- \`$file\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload validated catalog
        uses: actions/upload-artifact@v4
        with:
          name: validated-sample-catalog
          path: |
            samples/hosted-agent/sample-catalog.json
          if-no-files-found: error
          retention-days: 7

      - name: Report validation-only result
        if: ${{ inputs.validation_only }}
        shell: bash
        run: |
          echo "Validation-only run: catalog generated and validated. No branch or PR was created." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate GitHub App token
        if: ${{ !inputs.validation_only && steps.diff.outputs.has_changes == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Resolve pull request labels
        if: ${{ !inputs.validation_only && steps.diff.outputs.has_changes == 'true' }}
        id: labels
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          existing_labels=$(gh api --paginate repos/${{ github.repository }}/labels --jq '.[].name')
          matched_labels=""

          while IFS= read -r candidate; do
            if [[ -z "$candidate" ]]; then
              continue
            fi

            if grep -Fqx "$candidate" <<< "$existing_labels"; then
              matched_labels+="$candidate"
              matched_labels+=$'\n'
            fi
          done <<< "$PR_LABEL_CANDIDATES"

          {
            echo "labels<<EOF"
            printf '%s' "$matched_labels"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate PR branch name
        if: ${{ !inputs.validation_only && steps.diff.outputs.has_changes == 'true' }}
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="ci/sync-sample-catalog-${BASE_BRANCH}-${RUN_ID}"
          existing=$(gh api "repos/${REPOSITORY}/git/matching-refs/heads/${branch}" --jq 'length')
          if [[ "$existing" != '0' ]]; then
            echo "This run already created a branch. Refusing to overwrite it; start a new run." >&2
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: 6. Create draft pull request
        if: ${{ !inputs.validation_only && steps.diff.outputs.has_changes == 'true' }}
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          draft: always-true
          commit-message: |
            ci: sync sample catalog from foundry-samples (${{ github.ref_name }})
          title: "ci: sync sample catalog from foundry-samples (${{ github.ref_name }})"
          body: |
            ## Summary
            This automated draft PR incrementally updates `samples/hosted-agent/sample-catalog.json`
            from a pinned scan of `microsoft-foundry/foundry-samples`.
            The single snapshot keeps template facts in `templates` and grouping, Patterns,
            and Details in `cards`/`patterns`. Clients read one Raw file without a REST revision lookup.

            ## What changed
            - Surviving template metadata, card IDs, titles, Patterns, and relative ordering are preserved.
            - Cards with unchanged membership keep their Details verbatim and require no review call.
            - Deleted templates and their card references are removed together; empty cards and unused dimension options are removed.
            - New template metadata is generated by the existing AI service from its README; dimensions come from source metadata.
            - AI prefers existing cards with the same core task, title and Pattern. Occupied language/framework/protocol tuples cannot be reused within a card.
            - Proposed new cards are independently compared with every tuple-compatible candidate in the same Pattern, including cards created earlier in the run. A same-task result reuses the candidate; SDK or protocol differences alone do not justify a new card.
            - After grouping, membership-changed cards receive an explicit keep/change audit of all eight Details fields against the final members' pinned READMEs. Audit actions must match the sparse patch. Both reviews select supplied README excerpt IDs; code resolves them to original text instead of asking AI to copy quotes. Reviews and changed fields are logged.
            - Valid Requirements are preserved unless factually inaccurate. Commas do not create extra values, and requiresModel=false does not imply model access is unnecessary. Variant-specific approval/recovery claims must be qualified; generated output describes one selected implementation.
            - Deletion-only membership changes also require Details review for surviving cards; removing a whole card does not.
            - New cards are created only when no compatible candidate fits; their Details and one primary Pattern are AI-generated for review.
            - The catalog commitSha advances only when templates are added or removed. It also pins the implementations of surviving templates to that revision.
            - Failed AI generation/review, incomplete audits, unknown README references, incomplete scans, or invalid grouping stop the job before PR creation. Verified source references do not replace human review of semantic accuracy.
            - A final bounded agent step reads the repository review skill and fixed-source evidence, then proposes prose corrections to this Draft PR. Trusted code validates scope, evidence references and tests before appending a commit. Failed or unresolved review leaves the Draft PR open and the workflow blocked; no approval or merge is automated.

            ## Reviewer Checks
            - Confirm the catalog is self-contained and card-only edits do not change template facts.
            - Confirm new templates have correct `language`, `framework`, and `protocol` values.
            - Review the auto-generated `description` for any new templates.
            - Confirm no PM-edited display fields were accidentally lost.
            - Confirm every template belongs to one card and each card's selection combinations are unique.
            - Review card Details and Pattern assignments when their template membership changes.
            - Confirm existing-card reuse preserves the core task and Details edits are minimal and accurate for every variant; uniqueness is enforced by code, not left to AI.
          labels: ${{ steps.labels.outputs.labels }}
          add-paths: |
            samples/hosted-agent/sample-catalog.json

      - name: Report PR result
        if: ${{ !inputs.validation_only && steps.diff.outputs.has_changes == 'true' }}
        shell: bash
        env:
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "PR operation: $PR_OPERATION"
          echo "PR URL: $PR_URL"

          {
            echo
            echo "## Pull Request"
            echo
            if [[ -n "$PR_URL" ]]; then
              echo "- Operation: \`$PR_OPERATION\`"
              echo "- PR: [#${PR_NUMBER:-?}]($PR_URL)"
            else
              echo "- No pull request was created or updated (peter-evans/create-pull-request returned no URL)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 7. Review with skill and commit verified corrections
        if: ${{ !inputs.validation_only && steps.cpr.outputs.pull-request-number != '' }}
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          CATALOG_REVIEW_MODEL: ${{ vars.CATALOG_REVIEW_MODEL }}
          CATALOG_REVIEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
          CATALOG_REVIEW_BRANCH: ${{ steps.branch.outputs.name }}
          CATALOG_REVIEW_BASE: ${{ github.ref_name }}
          CATALOG_REVIEW_HEAD: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: node .github/scripts/review_catalog_pr.mjs

      - name: Upload final review report
        if: ${{ always() && !inputs.validation_only && steps.cpr.outputs.pull-request-number != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-review
          path: ${{ runner.temp }}/catalog-review/
          if-no-files-found: warn
          retention-days: 7
